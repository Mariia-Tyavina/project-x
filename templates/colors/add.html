{% extends "base.html" %}
{% block title %}Добавить цвет{% endblock %}
{% block content %}
<h2>➕ Добавить новый цвет</h2>

<form method="POST" style="margin-bottom: 20px;">
    <label for="color" style="display: block; margin-bottom: 8px; font-weight: bold;">Название цвета:</label>
    <input type="text" 
           name="color" 
           id="color" 
           placeholder="например: красный, #ff00cc, green"
           required
           style="width: 100%; 
                  max-width: 400px;
                  padding: 10px 16px;
                  font-size: 1rem;
                  background: rgba(255,255,255,0.1);
                  border: 1px solid rgba(255,255,255,0.3);
                  border-radius: 30px;
                  color: white;
                  outline: none;
                  transition: all 0.3s ease;">
    <br><br>
    <label for="tags" style="display: block; margin-bottom: 8px; font-weight: bold;">Теги (через пробел):</label>
    <input type="text" 
           name="tags" 
           id="tags" 
           placeholder="теплый яркий основной"
           style="width: 100%; 
                  max-width: 400px;
                  padding: 10px 16px;
                  font-size: 1rem;
                  background: rgba(255,255,255,0.1);
                  border: 1px solid rgba(255,255,255,0.3);
                  border-radius: 30px;
                  color: white;
                  outline: none;
                  transition: all 0.3s ease;">
    <br><br>
    <button type="submit" class="button">💾 Сохранить цвет</button>
</form>

<div style="margin-top: 30px;">
    <a href="{{ url_for('colors_list') }}" class="button" style="background: rgba(255,255,255,0.2); backdrop-filter: blur(5px);">
        ← Назад к списку цветов
    </a>
</div>

<style>
    input:focus {
        border-color: #4a90e2 !important;
        box-shadow: 0 0 12px rgba(74,144,226,0.5);
        background: rgba(0,0,0,0.6) !important;
    }
    @media (max-width: 600px) {
        input {
            font-size: 0.9rem;
            padding: 8px 12px;
        }
        .button {
            padding: 6px 14px;
        }
    }
</style>
{% endblock %}
