{% extends "base.html" %}
{% block title %}Добавить цвет{% endblock %}
{% block content %}
<h2>➕ Добавить новый цвет</h2>
<form method="POST">
    <label>Название цвета:</label> <input type="text" name="color" placeholder="например: красный, #ff0000, red" required><br>
    <label>Теги (через пробел):</label> <input type="text" name="tags" placeholder="теплый яркий основной"><br>
    <button type="submit">💾 Сохранить цвет</button>
</form>
<p><a href="{{ url_for('colors_list') }}">← Назад к списку цветов</a></p>
{% endblock %}
