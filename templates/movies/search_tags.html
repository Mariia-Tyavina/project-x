{% extends "base.html" %}
{% block title %}Поиск по тегам{% endblock %}
{% block content %}
<h2>🏷️ Поиск фильмов по тегам</h2>
<form method="POST" style="margin-bottom: 20px;">
    <label for="tags" style="display: block; margin-bottom: 10px; font-weight: bold;">Теги (через пробел):</label>
    <input type="text" 
           name="tags" 
           id="tags" 
           placeholder="например: комедия боевик драма"
           required
           style="width: 100%; 
                  max-width: 500px;
                  padding: 12px 18px;
                  font-size: 1rem;
                  background: rgba(255,255,255,0.1);
                  border: 1px solid rgba(255,255,255,0.3);
                  border-radius: 40px;
                  color: white;
                  outline: none;
                  transition: all 0.3s ease;">
    <br><br>
    
    <label style="display: inline-flex; align-items: center; gap: 10px; cursor: pointer;">
        <input type="checkbox" name="match_all" style="width: 18px; height: 18px; cursor: pointer;">
        <span style="font-weight: bold;">Должны совпадать все теги</span>
    </label>
    <br><br>
    
    <button type="submit" class="button">🔍 Искать</button>
</form>

<div style="margin-top: 30px;">
    <a href="{{ url_for('movies_list') }}" class="button" style="background: rgba(255,255,255,0.2); backdrop-filter: blur(5px);">
        ← Назад
    </a>
</div>

<style>
    input[name="tags"]:focus {
        border-color: #4a90e2;
        box-shadow: 0 0 12px rgba(74,144,226,0.5);
        background: rgba(0,0,0,0.5);
    }
    input[type="checkbox"]:hover {
        transform: scale(1.05);
    }

    @media (max-width: 600px) {
        input[name="tags"] {
            font-size: 0.9rem;
            padding: 10px 14px;
        }
    }
</style>
{% endblock %}
