{% extends "base.html" %}
{% block title %}Добавить из TMDB{% endblock %}
{% block content %}
<h2>🌐 Добавить фильм автоматически (TMDB)</h2>
<form method="POST">
    <label>Название фильма:</label> <input type="text" name="query" placeholder="Например: Матрица" required><br>
    <button type="submit">🔍 Найти и добавить</button>
</form>
<p><small>Будет добавлен первый результат поиска (жанры станут тегами). Если фильм уже есть в базе — дубль не создастся.</small></p>
<p><a href="{{ url_for('movies_list') }}">← Назад к списку фильмов</a></p>
{% endblock %}
